    </div>

    <div class="sidebar__foot">
      <svg class="progressring" viewBox="0 0 30 30" aria-hidden="true">
        <circle class="track" cx="15" cy="15" r="12.5"></circle>
        <circle class="bar" id="progreso-bar" cx="15" cy="15" r="12.5"

      </svg>
      <span id="progreso-texto">0 de 0 leídas</span>
    </div>
  </aside>

  <!-- ========================== BARRA SUPERIOR ======================== -->
  <header class="topbar">
    <button class="iconbtn navtoggle" id="btn-menu" type="button" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>

    <nav class="topbar__crumbs" id="crumbs" aria-label="Ruta de navegación"></nav>

    <div class="topbar__actions">
      <button class="searchtrigger" id="btn-buscar" type="button">

        <kbd>Ctrl</kbd><kbd>K</kbd>
      </button>
      <button class="iconbtn" id="btn-tema" type="button" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <!-- ============================ CONTENIDO =========================== -->

    <article class="content" id="contenido" tabindex="-1"></article>

<!-- ========================== PALETA DE BÚSQUEDA ======================== -->
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Buscar en el curso" hidden>
  <div class="palette__panel">
    <div class="palette__inputwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="palette__input" id="palette-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Busca un comando, una opción o un concepto…" aria-label="Consulta de búsqueda">
    </div>
    <div class="palette__results" id="palette-results"></div>
    <div class="palette__foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
      <span><kbd>Enter</kbd> abrir</span>
      <span><kbd>Esc</kbd> cerrar</span>
      <span style="margin-left:auto"><b id="idx-count">0</b> entradas indexadas</span>

  </div>
